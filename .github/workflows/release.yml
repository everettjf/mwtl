name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (requires a matching v* tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag and project version
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        run: |
          $project = Select-String -Path CMakeLists.txt -Pattern 'project\(mwtl VERSION ([0-9.]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ("v$project" -ne "${{ github.ref_name }}") { throw "Tag does not match project version v$project" }
      - name: Configure
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DMWTL_BUILD_EXAMPLES=ON -DMWTL_BUILD_TESTS=ON
      - name: Build and test
        run: |
          cmake --build build/release --config Release --verbose
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C Release -B artifacts
      - name: Upload dry-run package
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mwtl-${{ github.sha }}-x64
          path: artifacts/*.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -Filter *.zip | ForEach-Object { Resolve-Path -Relative $_.FullName }
          if (-not $files) { throw "No release package found" }
          gh release create "${{ github.ref_name }}" @files --generate-notes --verify-tag
